
# The crosses_v2 module misspells RETENTION_BOOT_MODE in its Kconfig; without
# it &bootloader just reboots instead of entering the UF2 bootloader.
CONFIG_RETENTION_BOOT_MODE=y

# Enable mouse emulation.
CONFIG_ZMK_POINTING=y

# Disable ZMK Studio and its runtime keymap support.
CONFIG_ZMK_STUDIO=n

# Enter idle after 30 minutes and deep sleep after one hour of inactivity.
CONFIG_ZMK_IDLE_TIMEOUT=1800000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
